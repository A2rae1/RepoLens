<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>RepoLens · 开源项目调研</title><link rel="stylesheet" href="/style.css"></head><body><div id="app"><header><h1>RepoLens</h1><span>开源项目调研与复现</span><button v-if="account" @click="logout">退出 {{account.user}}</button></header><main><form v-if="!account" class="card" @submit.prevent="login"><h2>登录调研工作台</h2><label>账号<input v-model="username" autocomplete="username" required></label><label>密码<input v-model="password" type="password" autocomplete="current-password" required></label><button class="primary" :disabled="busy">登录</button></form><template v-else><p role="status">{{notice}}</p>
          <section v-if="page==='agent'">
            <p class="intro">
              固定仓库版本，带着证据调研。执行验证前需要你明确确认。
            </p>
            <div class="two-columns">
              <form class="card" @submit.prevent="createJob">
                <div class="eyebrow">REPOLENS</div>
                <h2>发起仓库调研</h2>
                <label
                  >工作区<select v-model="agent.workspace">
                    <option v-for="w in workspaces" :value="w.id">
                      {{w.name}}
                    </option>
                  </select></label
                >
                <div class="inline">
                  <input
                    v-model="workspaceName"
                    placeholder="新工作区名称"
                  /><button type="button" @click="newWorkspace">创建</button>
                </div>
                <label
                  >公开 GitHub 仓库<input
                    v-model="agent.repo"
                    placeholder="https://github.com/组织/仓库"
                    required /></label
                ><label
                  >完整 commit（40位）<input
                    v-model="agent.commit"
                    pattern="[a-fA-F0-9]{40}"
                    required /></label
                ><label
                  >问题或环境约束<textarea
                    v-model="agent.question"
                    required
                    maxlength="4000"
                    placeholder="依赖什么Python版本？证据在哪里？"
                  ></textarea></label
                ><button class="primary" :disabled="busy||!agent.workspace">
                  开始调研
                </button>
              </form>
              <div>
                <article class="row-card" v-for="j in jobs" :key="j.id">
                  <div>
                    <span class="badge">{{labels[j.status]||j.status}}</span>
                    <h3>{{j.question.slice(0,60)}}</h3>
                    <p class="mono">{{j.commitSha.slice(0,10)}}</p>
                  </div>
                  <div class="actions">
                    <button @click="inspectJob(j)">查看</button
                    ><button
                      v-if="['QUEUED','RUNNING','AWAITING_APPROVAL'].includes(j.status)"
                      @click="cancelJob(j)"
                    >
                      取消</button
                    ><button
                      v-if="j.status==='FAILED'"
                      @click="retryJob(j)"
                      :disabled="busy"
                    >
                      重试此任务
                    </button>
                  </div>
                </article>
                <div class="empty" v-if="!jobs.length">
                  调研记录会显示在这里。
                </div>
              </div>
            </div>
            <article class="card" v-if="agent.workspace">
              <h2>参考资料包</h2>
              <p>
                支持保存与校验12MB以内的ZIP附件。中断后重新选择同一文件可续传；附件不会替换固定版本的仓库源码。
              </p>
              <input
                type="file"
                accept=".zip"
                :disabled="busy"
                @change="uploadArchive"
              />
              <p role="status">{{uploadStatus}}</p>
              <button v-if="uploadedArchive" @click="downloadArchive">
                下载已校验资料包
              </button>
            </article>
            <article class="card" v-if="selectedJob">
              <h2>调研过程</h2>
              <p v-for="e in agentEvents">{{e.kind}} · {{eventText(e)}}</p>
              <div class="approval" v-if="approval">
                <h3>请确认验证计划</h3>
                <pre>{{JSON.stringify(approval.plan,null,2)}}</pre>
                <p>
                  执行来自公开仓库的代码有风险；这里是有资源限制的容器环境。
                </p>
                <p v-if="approval.decision">你的决定已保存，正在恢复任务。</p>
                <p v-else-if="approval.expired">
                  计划已过期。可以拒绝，或重新查看后再批准。
                </p>
                <button
                  v-if="approval.expired && !approval.decision"
                  @click="renewApproval"
                  :disabled="busy"
                >
                  重新查看并延长确认时间
                </button>
                <button
                  v-if="!approval.decision"
                  class="primary"
                  @click="decide(true)"
                  :disabled="busy || approval.expired"
                >
                  批准这份计划</button
                ><button
                  v-if="!approval.decision"
                  @click="decide(false)"
                  :disabled="busy"
                >
                  拒绝执行
                </button>
              </div>
              <div v-if="report">
                <h3>证据报告</h3>
                <pre class="answer">{{report.answer}}</pre>
                <ul>
                  <li v-for="c in report.citations">
                    <a :href="c.url" target="_blank" rel="noopener noreferrer"
                      >{{(c.labels||[]).join(' ')}} ·
                      {{c.path}}:{{c.start_line}}–{{c.end_line}}</a
                    >
                  </li>
                </ul>
                <p>{{report.warning}}</p>
                <button @click="exportReport" :disabled="busy">
                  导出证据报告
                </button>
                <form @submit.prevent="followup">
                  <label
                    >继续追问同一仓库版本<textarea
                      v-model="followupQuestion"
                      maxlength="4000"
                      required
                    ></textarea></label
                  ><button class="primary" :disabled="busy">发送追问</button>
                </form>
              </div>
            </article>
          </section>
</template><p class="error" role="alert" v-if="error">{{error}}</p></main><footer>RepoLens · 固定版本、源码证据与受控验证</footer></div><script type="module" src="/app.js"></script></body></html>
